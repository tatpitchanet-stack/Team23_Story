<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Portfolio Item</title>
    <!-- Bootstrap CDN ตามข้อกำหนด -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Relative Path ไปยัง CSS ของโปรเจกต์ -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow-sm max-w-lg mx-auto">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">เพิ่มผลงาน (Portfolio Item)</h4>
        </div>
        <div class="card-body">
            <!-- id="portfolio-item-form" ตรงตามที่ระบุใน Issue #4 -->
            <form id="portfolio-item-form">
                
                <!-- 1. Title -->
                <div class="mb-3">
                    <label for="title" class="form-label">1. ชื่อผลงาน (Title) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>

                <!-- 2. Type & 3. Date -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="type" class="form-label">2. ประเภทผลงาน (Type) <span class="text-danger">*</span></label>
                        <select class="form-select" id="type" name="type" required>
                            <option value="">เลือกประเภท...</option>
                            <option value="Project">Project</option>
                            <option value="Activity">Activity</option>
                            <option value="Certificate">Certificate</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="date" class="form-label">3. วันที่ (Date) <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="date" name="date" required>
                    </div>
                </div>

                <!-- 4. Role -->
                <div class="mb-3">
                    <label for="role" class="form-label">4. บทบาทหรือหน้าที่ของคุณ (Role)</label>
                    <input type="text" class="form-control" id="role" name="role" placeholder="เช่น Developer, Designer">
                </div>

                <!-- 5. Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">5. รายละเอียดผลงาน (Description)</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>

                <!-- 6. Skills -->
                <div class="mb-3">
                    <label for="skills" class="form-label">6. ทักษะที่ใช้ (Skills)</label>
                    <input type="text" class="form-control" id="skills" name="skills" placeholder="เช่น HTML, CSS, JavaScript">
                </div>

                <!-- 7. Reflection (4 sub-fields) -->
                <div class="p-3 mb-3 border rounded bg-white">
                    <h5 class="mb-3">7. สิ่งที่ได้จากการทำงาน (Reflection)</h5>
                    <div class="mb-2">
                        <label for="whatIdid" class="form-label">สิ่งที่ทำ (What I did)</label>
                        <textarea class="form-control" id="whatIdid" name="whatIdid" rows="2"></textarea>
                    </div>
                    <div class="mb-2">
                        <label for="whatIlearned" class="form-label">สิ่งที่ได้เรียนรู้ (What I learned)</label>
                        <textarea class="form-control" id="whatIlearned" name="whatIlearned" rows="2"></textarea>
                    </div>
                    <div class="mb-2">
                        <label for="challenge" class="form-label">ปัญหาหรือความท้าทาย (Challenge)</label>
                        <textarea class="form-control" id="challenge" name="challenge" rows="2"></textarea>
                    </div>
                    <div class="mb-2">
                        <label for="nextStep" class="form-label">สิ่งที่จะทำต่อไป (Next step)</label>
                        <textarea class="form-control" id="nextStep" name="nextStep" rows="2"></textarea>
                    </div>
                </div>

                <!-- 8. Evidence -->
                <div class="mb-4">
                    <label for="evidence" class="form-label">8. หลักฐานผลงาน (Evidence URL) <span class="text-danger">*</span></label>
                    <input type="url" class="form-control" id="evidence" name="evidence" placeholder="https://..." required>
                </div>

                <!-- Submit Button -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">บันทึกผลงาน</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
