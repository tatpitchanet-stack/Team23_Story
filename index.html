<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a portfolio</title>
</head>
<body>
    <div class="form-card">
        <div class="form-header">
            <h2>Create your portfolio</h2>
            <p>Tell us about yourself.</p>
        </div>
        
        <form id="portfolio-profile-form">
            
            <!-- Display Name Field -->
            <div class="form-group">
                <label for="displayName">Display name *</label>
                <input type="text" id="displayName" name="displayName" placeholder="e.g. Jamie" required>
            </div>

            <!-- What I Enjoy Field -->
            <div class="form-group">
                <label for="whatIEnjoy">What I enjoy</label>
                <input type="text" id="whatIEnjoy" name="whatIEnjoy" placeholder="e.g. Designing websites" required>
            </div>

            <!-- What I've Tried Field -->
            <div class="form-group">
                <label for="whatIVeTried">What I've tried</label>
                <input type="text" id="whatIVeTried" name="whatIVeTried" placeholder="e.g. My first group project" required>
            </div>

            <!-- What I'm Curious About Field -->
            <div class="form-group">
                <label for="whatImCuriousAbout">What I'm curious about</label>
                <input type="text" id="whatImCuriousAbout" name="whatImCuriousAbout" placeholder="e.g. Cloud computing" required>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button type="submit" class="btn-primary">Create portfolio</button>
                <button type="reset" class="btn-secondary">Clear</button>
            </div>
        </form>
    </div>

</body>
</html>
